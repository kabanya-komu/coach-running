<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ランニング音声コーチング・プロトタイプ</title>
    <!-- Leaflet CSS (地図用) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-green: #00e676;
            --accent-red: #ff5252;
            --accent-blue: #29b6f6;
            --border-color: #333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
        }
        h1 { font-size: 1.2rem; text-align: center; margin-bottom: 10px; color: #fff; }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            text-align: center;
        }
        .metric-box {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
        }
        .metric-value { font-size: 1.5rem; font-weight: bold; color: var(--accent-green); }
        .metric-label { font-size: 0.8rem; color: #aaa; }
        
        #map {
            width: 100%;
            height: 200px;
            border-radius: 8px;
            margin-top: 10px;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-start { background-color: var(--accent-green); color: #000; }
        .btn-stop { background-color: var(--accent-red); color: #fff; }
        .btn-sim { background-color: var(--accent-blue); color: #000; margin-top: 10px; width: 100%; }

        .settings-section h2 { font-size: 1rem; margin-top: 0; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
        label { display: block; font-size: 0.85rem; margin-top: 8px; color: #ccc; }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .log-box {
            background: #000;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.8rem;
            height: 80px;
            overflow-y: auto;
            color: var(--accent-green);
        }
    </style>
</head>
<body>

    <h1>🎙️ ランニング音声コーチング</h1>

    <!-- ダッシュボード -->
    <div class="card">
        <div class="metrics-grid">
            <div class="metric-box">
                <div class="metric-value" id="distDisplay">0.00</div>
                <div class="metric-label">走行距離 (km)</div>
            </div>
            <div class="metric-box">
                <div class="metric-value" id="paceDisplay">--'--"</div>
                <div class="metric-label">現在ペース (/km)</div>
            </div>
            <div class="metric-box">
                <div class="metric-value" id="timeDisplay">00:00</div>
                <div class="metric-label">経過時間</div>
            </div>
            <div class="metric-box">
                <div class="metric-value" id="statusDisplay">待機中</div>
                <div class="metric-label">ステータス</div>
            </div>
        </div>
        
        <div class="btn-group">
            <button class="btn-start" id="startBtn" onclick="startRunning()">ラン開始</button>
            <button class="btn-stop" id="stopBtn" onclick="stopRunning()" disabled>終了</button>
        </div>
        <!-- 室内テスト用シミュレーションボタン -->
        <button class="btn-sim" onclick="toggleSimulation()">🧪 デモ走行シミュレーター (室内テスト用)</button>
    </div>

    <!-- 地図エリア -->
    <div class="card">
        <h2 style="font-size:0.9rem; margin:0 0 5px 0;">リアルタイム軌跡マップ</h2>
        <div id="map"></div>
    </div>

    <!-- 音声ログ -->
    <div class="card">
        <h2 style="font-size:0.9rem; margin:0 0 5px 0;">音声コーチ・ログ</h2>
        <div class="log-box" id="logBox">アプリ起動完了。準備OKです。<br></div>
    </div>

    <!-- 設定エリア -->
    <div class="card settings-section">
        <h2>⚙️ 走行・音声設定</h2>
        <label>目標距離 (km)</label>
        <input type="number" id="targetDist" value="5" step="0.5">
        
        <label>目標ペース (分/km - 例: 6.5なら6分30秒)</label>
        <input type="number" id="targetPace" value="6.0" step="0.1">

        <label>音声キャラクター・トーン</label>
        <select id="voicePreset">
            <option value="coach">男のコーチ (低め・力強い)</option>
            <option value="woman" selected>若い女性 (高め・明るい)</option>
            <option value="child">子供の声 (かなり高い・早口)</option>
            <option value="announcer">競馬実況風 (ハイテンション)</option>
        </select>
    </div>

    <!-- Leaflet JS (地図用) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let isRunning = false;
        let startTime = null;
        let timerInterval = null;
        let watchId = null;
        let totalDistance = 0; // meters
        let lastPosition = null;
        let routeCoordinates = [];
        let map, polyline, marker;
        
        // シミュレーション用
        let isSimulating = false;
        let simInterval = null;

        // Wake Lock
        let wakeLock = null;

        // 音声プリセットの設定値 (Web Speech APIの pitch, rate)
        const voicePresets = {
            coach:     { pitch: 0.6, rate: 1.0, label: "男のコーチ" },
            woman:     { pitch: 1.3, rate: 1.1, label: "若い女性" },
            child:     { pitch: 1.8, rate: 1.3, label: "子供の声" },
            announcer: { pitch: 1.0, rate: 1.4, label: "競馬実況風" }
        };

        // 初期マップ設定
        function initMap() {
            // 名古屋駅あたりを初期中心に
            map = L.map('map').setView([35.1709, 136.8815], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
            polyline = L.polyline([], {color: '#00e676', weight: 4}).addTo(map);
        }
        initMap();

        // ログ出力 ＆ 音声発話
        function speak(text, customPresetKey = null) {
            const logBox = document.getElementById('logBox');
            logBox.innerHTML += `> ${text}<br>`;
            logBox.scrollTop = logBox.scrollHeight;

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 喋りかけをクリア
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';

                const presetKey = customPresetKey || document.getElementById('voicePreset').value;
                const preset = voicePresets[presetKey] || voicePresets.woman;
                
                utterance.pitch = preset.pitch;
                utterance.rate = preset.rate;

                window.speechSynthesis.speak(utterance);
            }
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Wake Lock acquired');
                }
            } catch (err) {
                console.error(`${err.name}, ${err.message}`);
            }
        }

        function startRunning() {
            if (isRunning) return;
            isRunning = true;
            totalDistance = 0;
            startTime = new Date();
            routeCoordinates = [];
            polyline.setLatLngs([]);

            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('statusDisplay').innerText = "走行中";

            requestWakeLock();
            speak("さあスタートです！最初は焦らずリズムを作っていきましょう！");

            // タイマー開始
            timerInterval = setInterval(updateTimer, 1000);

            // GPSトラッキング開始
            if (navigator.geolocation && !isSimulating) {
                watchId = navigator.geolocation.watchPosition(updatePosition, handleGeoError, {
                    enableHighAccuracy: true,
                    maximumAge: 1000,
                    timeout: 10000
                });
            }
        }

        function stopRunning() {
            if (!isRunning) return;
            isRunning = false;
            if (isSimulating) toggleSimulation();

            clearInterval(timerInterval);
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            if (wakeLock !== null) wakeLock.release();

            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('statusDisplay').innerText = "完了";

            speak("ゴール！お疲れ様でした！最高のランでしたね！");
        }

        function updateTimer() {
            const now = new Date();
            const elapsedSec = Math.floor((now - startTime) / 1000);
            const min = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
            const sec = String(elapsedSec % 60).padStart(2, '0');
            document.getElementById('timeDisplay').innerText = `${min}:${sec}`;

            // 簡易イベントチェック (例: 経過時間や距離に応じたランダム実況など)
            checkTriggers(elapsedSec);
        }

        function updatePosition(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const latLng = [lat, lng];

            if (lastPosition) {
                const dist = calculateDistance(lastPosition[0], lastPosition[1], lat, lng);
                totalDistance += dist;
            }
            lastPosition = latLng;
            routeCoordinates.push(latLng);

            polyline.setLatLngs(routeCoordinates);
            map.setView(latLng);

            updateDisplayMetrics();
        }

        function handleGeoError(error) {
            console.warn(`GPS Error: ${error.message}`);
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // metres
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; // metres
        }

        function updateDisplayMetrics() {
            const distKm = totalDistance / 1000;
            document.getElementById('distDisplay').innerText = distKm.toFixed(2);

            // 簡易ペース計算
            const elapsedSec = (new Date() - startTime) / 1000;
            if (distKm > 0.05) {
                const secPerKm = elapsedSec / distKm;
                const pMin = Math.floor(secPerKm / 60);
                const pSec = Math.floor(secPerKm % 60);
                document.getElementById('paceDisplay').innerText = `${pMin}'${String(pSec).padStart(2,'0')}"`;
            }
        }

        // 室内テスト用シミュレーター（ボタン一発で距離とペースを擬似進行させる）
        function toggleSimulation() {
            isSimulating = !isSimulating;
            if (isSimulating) {
                if (!isRunning) startRunning();
                speak("デモ走行シミュレーションを開始します。");
                
                simInterval = setInterval(() => {
                    totalDistance += 100; // 1秒ごとに100m進む設定
                    const fakeLat = 35.1709 + (totalDistance / 100000);
                    const fakeLng = 136.8815 + (totalDistance / 100000);
                    routeCoordinates.push([fakeLat, fakeLng]);
                    polyline.setLatLngs(routeCoordinates);
                    map.setView([fakeLat, fakeLng]);
                    
                    updateDisplayMetrics();

                    // 簡易的な距離トリガーのテスト
                    const km = totalDistance / 1000;
                    if (Math.abs(km - 1.0) < 0.05) {
                        speak("1キロ通過！いい調子だね！", "woman");
                    } else if (Math.abs(km - 3.0) < 0.05) {
                        speak("がんばれェ！中間地点まですぐだよ！", "child");
                    }
                }, 1000);
            } else {
                clearInterval(simInterval);
                speak("シミュレーションを終了します。");
            }
        }

        function checkTriggers(elapsedSec) {
            // 時間や距離に応じたカスタム発火ロジックをここに組み込めます
        }
    </script>
</body>
</html>
